<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020305" />
  <title>Dormant</title>
  <meta name="description" content="An ancient troll overgrown by a living forest — an interactive, procedurally generated 3D artwork." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%23020305%22%2F%3E%3Cpath%20d%3D%22M8%2026c0-9%203-17%208-17s8%208%208%2017%22%20fill%3D%22none%22%20stroke%3D%22%231b4fa8%22%20stroke-width%3D%222%22%2F%3E%3Cellipse%20cx%3D%2212.5%22%20cy%3D%2215%22%20rx%3D%222.6%22%20ry%3D%222%22%20fill%3D%22%231fe07a%22%2F%3E%3Cellipse%20cx%3D%2219.5%22%20cy%3D%2215%22%20rx%3D%222.2%22%20ry%3D%221.8%22%20fill%3D%22%231fe07a%22%2F%3E%3Cpath%20d%3D%22M11%2021h10%22%20stroke%3D%22%231fe07a%22%20stroke-width%3D%222%22%20stroke-dasharray%3D%222%201%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%226%22%20width%3D%222%22%20height%3D%222%22%20fill%3D%22%23d21fd6%22%2F%3E%3C%2Fsvg%3E" />
  <style>
:root {
  --bg: #020305;
  --ink: rgba(80, 255, 170, 0.78);
  --ink-dim: rgba(80, 255, 170, 0.38);
  --line: rgba(40, 230, 160, 0.22);
  --cyan: #2fdcf2;
  --magenta: #d21fd6;
  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#stage:active { cursor: grabbing; }

/* ---------- loader ---------- */
#loader {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  z-index: 10;
  transition: opacity 1.6s ease, filter 1.6s ease;
}
#loader.done { opacity: 0; filter: blur(6px); pointer-events: none; }
.loader-inner { width: min(260px, 70vw); }
.loader-title {
  font-size: 11px;
  letter-spacing: 0.6em;
  color: var(--ink);
  margin-bottom: 14px;
  text-shadow: 1px 0 var(--magenta), -1px 0 var(--cyan);
}
.loader-bar { height: 1px; background: var(--line); overflow: hidden; }
.loader-bar span {
  display: block;
  height: 100%;
  background: var(--ink);
  transform-origin: left;
  transform: scaleX(0);
  transition: transform 0.35s ease;
  box-shadow: 0 0 8px var(--ink);
}
.loader-status {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-dim);
  text-transform: lowercase;
}
.loader-status.error { color: var(--magenta); }

/* ---------- HUD ---------- */
#hud { transition: opacity 2s ease 0.6s; }
#hud.hidden { opacity: 0; pointer-events: none; }

.hud-title {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  left: 16px;
  font-size: 10px;
  letter-spacing: 0.42em;
  color: var(--ink-dim);
  pointer-events: none;
  z-index: 5;
}
.hud-title span { letter-spacing: 0.12em; opacity: 0.7; }

.hud-controls {
  position: fixed;
  left: 16px;
  bottom: max(14px, env(safe-area-inset-bottom));
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  z-index: 5;
  opacity: 0.5;
  transition: opacity 0.4s ease;
  max-width: calc(100vw - 32px);
}
.hud-controls:hover, .hud-controls:focus-within { opacity: 1; }

.hud-controls button {
  font: inherit;
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: lowercase;
  color: var(--ink);
  background: rgba(0, 12, 9, 0.45);
  border: 1px solid var(--line);
  padding: 5px 8px 5px 7px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(3px);
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.hud-controls button:hover { border-color: var(--ink); }
.hud-controls button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 1px; }
.hud-controls button .dot {
  width: 5px;
  height: 5px;
  background: var(--ink);
  box-shadow: 0 0 6px var(--ink);
}
.hud-controls button.off { color: var(--ink-dim); }
.hud-controls button.off .dot { background: transparent; box-shadow: none; outline: 1px solid var(--ink-dim); }
.hud-controls button.action .dot { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

.hud-hint {
  position: fixed;
  right: 16px;
  bottom: max(16px, env(safe-area-inset-bottom));
  font-size: 9.5px;
  letter-spacing: 0.16em;
  color: var(--ink-dim);
  pointer-events: none;
  transition: opacity 2.5s ease;
  z-index: 5;
}
.hud-hint.faded { opacity: 0; }

@media (max-width: 640px) {
  .hud-title span { display: none; }
  .hud-hint { display: none; }
  .hud-controls { left: 12px; right: 12px; opacity: 0.7; }
  .hud-controls button { padding: 7px 9px; }
}
</style>
</head>
<body>
  <canvas id="stage" aria-label="Interactive 3D scene of an ancient troll overgrown by forest"></canvas>

  <div id="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-title">DORMANT</div>
      <div class="loader-bar"><span></span></div>
      <div class="loader-status">waking the forest</div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-title">DORMANT <span>// the sleeper beneath the canopy</span></div>
    <div class="hud-controls" id="controls"></div>
    <div class="hud-hint" id="hint"></div>
  </div>
